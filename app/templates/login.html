{% extends "base.html" %}
{% block title %}Log in - PocketSmart AI{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Welcome back</h1>
    <p>Log in to access your planners and recommendation history.</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <form action="/login" method="post" class="form-stack">
        <label>
            Email
            <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button" type="submit">Log in</button>
    </form>
    <p class="muted">No account? <a href="/register">Create one</a>.</p>
</section>
{% endblock %}
