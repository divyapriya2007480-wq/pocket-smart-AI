{% extends "base.html" %}
{% block title %}Create account - PocketSmart AI{% endblock %}

{% block content %}
<section class="auth-card">
    <h1>Create your account</h1>
    <p>Save plans and revisit your recommendations at any time.</p>

    {% if error %}<div class="alert">{{ error }}</div>{% endif %}

    <form action="/register" method="post" class="form-stack">
        <label>
            Name
            <input type="text" name="name" minlength="2" maxlength="100" required>
        </label>
        <label>
            Email
            <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>
            Password
            <input type="password" name="password" minlength="8"
                   autocomplete="new-password" required>
            <small>Use at least 8 characters.</small>
        </label>
        <button class="button" type="submit">Create account</button>
    </form>
</section>
{% endblock %}
